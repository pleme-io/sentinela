[package]
name = "sentinela-config"
version.workspace = true
description = "sentinela-config — the shikumi-typed config surface (mirrors the pleme.gitops nix option surface)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
# The rollback probe list is an OPEN list: each entry is held as a JSON value
# and parsed into the closed kind enum one at a time, so a malformed entry is
# refused by name while its siblings load. Already a workspace dep (core).
serde_json = { workspace = true }
shikumi = "0.1.496"
sentinela-core = { path = "../sentinela-core" }

[dev-dependencies]
serde_json = { workspace = true }
serde_yaml = "0.9"
