[package]
name = "sentinela"
version.workspace = true
description = "sentinela — the pure-Rust Darwin GitOps node-sync daemon (the Mac peer of NixOS comin)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = true

[[bin]]
name = "sentinela"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sentinela-core = { path = "../sentinela-core" }
sentinela-config = { path = "../sentinela-config" }
serde = { workspace = true }
serde_yaml = "0.9"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
url = "2"
serde_json = { workspace = true }
# The same advisory-flock crate `fleet` uses for its rebuild lock, so both
# parties take the same `/tmp/fleet-rebuild.lock` against the same open
# file description semantics on macOS.
fs4 = "0.9"
# Process-group kill for the build deadline. The GROUP, not the pid:
# `process_group(0)` makes the rebuild a group leader, and killing only the
# leader would orphan exactly the descendants whose survival caused the 0.1.9
# pipe deadlock. std has no process-group kill and shelling out to `kill` is
# banned, so this is the remaining option — rustix rather than raw libc
# because the crate is `#![forbid(unsafe_code)]` and rustix's `killpg` wrapper
# is safe, so the ban stays intact instead of being carved out.
rustix = { version = "0.38", features = ["process"] }

[dev-dependencies]
tempfile = "3"
sentinela-core = { path = "../sentinela-core", features = ["mock"] }
