[package]
name = "sentinela"
version = "0.1.0"
description = "sentinela — the pure-Rust Darwin GitOps node-sync daemon (the Mac peer of NixOS comin)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = true

[[bin]]
name = "sentinela"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sentinela-core = { path = "../sentinela-core" }
sentinela-config = { path = "../sentinela-config" }
serde = { workspace = true }
serde_yaml = "0.9"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
url = "2"
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
sentinela-core = { path = "../sentinela-core", features = ["mock"] }
