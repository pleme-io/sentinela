[package]
name = "sentinela"
version.workspace = true
description = "sentinela — the pure-Rust Darwin GitOps node-sync daemon (the Mac peer of NixOS comin)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = true

[[bin]]
name = "sentinela"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
# The in-process sui driver (M2). OFF by default, deliberately: enabling it
# pulls the whole sui workspace into this build — the evaluator, the store
# layer, the builder — which is a large cost to impose on every node just to
# make one alternative driver available. A node opts in; `RebuildTool::Sui`
# already exists as the typed selector, and `preflight` refuses the pairing
# when the node's flake ref is one sui cannot resolve.
sui-driver = ["dep:sui-orchestrate", "dep:tokio"]

[dependencies]
sentinela-core = { path = "../sentinela-core" }
# ★★ The reconciler, made askable. See src/introspect.rs: this was the one
# pleme-io daemon with no kanshou surface, and it is the one whose entire job
# is converging state you cannot see -- so the only way to ask "is this node
# deploying?" was to read journalctl and interpret prose.
kanshou = "0.1"
# In-process rebuild driver — the thing that removes the wedge CLASS rather
# than detecting it (no subprocess ⇒ no pipe ⇒ no `jq` waiting on an EOF).
#
# ── ★ REGISTRY, NOT GIT — AND CURRENTLY BLOCKED ON sui's PUBLISH ────────
# Fleet rule: dependencies come from crates.io. A git dep would also block
# `cargo publish` of this crate, which is how the tsunagu detour went wrong
# earlier in this same change.
#
# PINNED TO THE NEWEST PUBLISHED VERSION, WHICH IS NOT THE ONE WE WANT.
# Measured 2026-08-11: crates.io has sui-orchestrate 0.1.156 / sui-compat
# 0.1.157, while sui's own workspace deps already require 0.1.175 —
# member-crate publishing has been failing for ~20 releases while tags kept
# advancing. `github:owner/repo/<rev>` resolution landed in 0.1.176, so THIS
# pin cannot yet resolve the only ref shape sentinela produces.
#
# Pinning the unpublished 0.1.176 is not an option even behind an optional
# feature: cargo resolves optional dependencies during lock resolution, so it
# breaks the DEFAULT build for every node. Measured, not assumed —
# `failed to select a version for the requirement sui-orchestrate ^0.1.176`.
#
# So the driver builds and is honest about the gap: `SuiDriver::build` refuses
# a `github:` ref with a typed error naming the version that fixes it, rather
# than passing it down to fail as a confusing `No such file or directory`.
# When sui's publish catches up, this becomes a one-line version bump and the
# refusal deletes itself.
sui-orchestrate = { version = "0.1.156", optional = true }
# `rebuild_native` is async and this daemon's loop is not. One current-thread
# runtime, created per call, is enough: a rebuild is a single long await, not
# a concurrency problem.
tokio = { version = "1", features = ["rt"], optional = true }
sentinela-config = { path = "../sentinela-config" }
serde = { workspace = true }
serde_yaml = "0.9"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
url = "2"
serde_json = { workspace = true }
# The same advisory-flock crate `fleet` uses for its rebuild lock, so both
# parties take the same `/tmp/fleet-rebuild.lock` against the same open
# file description semantics on macOS.
fs4 = "0.9"
# The bounded-subprocess primitive: a deadline, a file capture instead of a
# deadlocking pipe, and a process-GROUP kill. Extracted from this crate into
# the fleet daemon-lifecycle library once the consumer count reached six.
tsunagu = "0.1.7"

[dev-dependencies]
tempfile = "3"
sentinela-core = { path = "../sentinela-core", features = ["mock"] }
