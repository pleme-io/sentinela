[package]
name = "sentinela"
version.workspace = true
description = "sentinela — the pure-Rust Darwin GitOps node-sync daemon (the Mac peer of NixOS comin)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = true

[[bin]]
name = "sentinela"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sentinela-core = { path = "../sentinela-core" }
sentinela-config = { path = "../sentinela-config" }
serde = { workspace = true }
serde_yaml = "0.9"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
url = "2"
serde_json = { workspace = true }
# The same advisory-flock crate `fleet` uses for its rebuild lock, so both
# parties take the same `/tmp/fleet-rebuild.lock` against the same open
# file description semantics on macOS.
fs4 = "0.9"
# The bounded-subprocess primitive: a deadline, a file capture instead of a
# deadlocking pipe, and a process-GROUP kill. Extracted from this crate into
# the fleet daemon-lifecycle library once the consumer count reached six.
# git, not the registry: 0.1.7 carries `error_wedge` and `silent_after`, and
# the crates.io release is guardrail-blocked from the session that wrote them.
# Same https form every other fleet consumer uses (amimori, shirase, tobira) —
# ssh:// cannot be fetched inside the nix sandbox, which has tokens for https
# and no ssh credentials.
#
# Cost, stated rather than discovered later: a git dep blocks `cargo publish`
# of this crate. sentinela declares `publish = true` but has never been
# published (crates.io: "crate `sentinela` does not exist") and ships via
# nix-from-git, so nothing regresses today. Move back to a version pin once
# tsunagu 0.1.7 is on the registry.
tsunagu = { git = "https://github.com/pleme-io/tsunagu" }

[dev-dependencies]
tempfile = "3"
sentinela-core = { path = "../sentinela-core", features = ["mock"] }
