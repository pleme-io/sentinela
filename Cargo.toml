[workspace]
resolver = "3"
members = ["sentinela-core", "sentinela-config", "sentinela"]

[workspace.package]
# ── ★ THE ONE KEY auto-release NEEDS, AND IT WAS ABSENT ─────────────────
# `pleme-io/actions/rust-workspace-bump` bumps the WORKSPACE version, so a
# workspace that pins versions only per-member gives it nothing to bump:
#     ERROR rust-workspace-bump: workspace.package.version not found
# Every release run since 2026-08-02 failed on that line — including the
# heartbeat work — while the repo itself was green, because a red release
# is invisible from inside the repo. Members now inherit
# (`version.workspace = true`), so the workspace version is the single
# source and cannot drift member-to-member.
version = "0.1.17"
edition = "2024"
rust-version = "1.91.0"
license = "MIT"
authors = ["pleme-io"]
repository = "https://github.com/pleme-io/sentinela"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
blake3 = "1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
